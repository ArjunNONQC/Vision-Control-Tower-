<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1200" />
      <stop offset="70%" stop-color="#0a0700" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#5B4307" />
    </linearGradient>

    <!-- Mind Stone Core Glow -->
    <radialGradient id="stoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>

    <!-- Energy Ring Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFB300" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Strong Glow Filter for Accents -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Animations */
    .pulse-bg {
      animation: pulse 4s ease-in-out infinite alternate;
      transform-origin: center;
    }

    .float-gem {
      animation: float 5s ease-in-out infinite alternate;
      transform-origin: center;
    }

    .rotate-orbit-1 {
      animation: spin 10s linear infinite;
      transform-origin: 250px 250px;
    }

    .rotate-orbit-2 {
      animation: spin-reverse 14s linear infinite;
      transform-origin: 250px 250px;
    }

    .rotate-orbit-3 {
      animation: spin 8s linear infinite;
      transform-origin: 250px 250px;
    }

    .twinkle {
      animation: blink 2.5s ease-in-out infinite alternate;
    }

    .twinkle-delay {
      animation: blink 3.5s ease-in-out infinite alternate 1.5s;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
      100% { transform: translateY(6px) scale(0.99); }
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes blink {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <!-- Outer Frame & Base -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldFrame)" stroke-width="12" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#110B00" stroke-width="4" opacity="0.8" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldFrame)" stroke-width="2" opacity="0.5" />

  <!-- Background Ambient Glow -->
  <circle class="pulse-bg" cx="250" cy="250" r="120" fill="url(#stoneGlow)" opacity="0.3" filter="url(#intenseGlow)" />

  <!-- Ambient Particles -->
  <g id="particles">
    <circle class="twinkle" cx="170" cy="140" r="3" fill="#FFE082" filter="url(#glow)" />
    <circle class="twinkle-delay" cx="330" cy="130" r="2.5" fill="#FFD54F" filter="url(#glow)" />
    <circle class="twinkle" cx="360" cy="320" r="3" fill="#FFE082" filter="url(#glow)" />
    <circle class="twinkle-delay" cx="140" cy="330" r="2" fill="#FFCA28" filter="url(#glow)" />
    <circle class="twinkle" cx="270" cy="100" r="2" fill="#FFF9C4" />
    <circle class="twinkle-delay" cx="220" cy="390" r="3" fill="#FFB300" filter="url(#glow)" />
  </g>

  <!-- Rotating Orbital Rings -->
  <g class="rotate-orbit-1">
    <ellipse cx="250" cy="250" rx="170" ry="60" fill="none" stroke="url(#energyGrad)" stroke-width="3" transform="rotate(-30, 250, 250)" filter="url(#glow)" />
    <circle cx="100" cy="165" r="4" fill="#FFF9C4" filter="url(#intenseGlow)" />
  </g>

  <g class="rotate-orbit-2">
    <ellipse cx="250" cy="250" rx="175" ry="65" fill="none" stroke="url(#energyGrad)" stroke-width="3.5" transform="rotate(45, 250, 250)" filter="url(#glow)" />
    <circle cx="380" cy="170" r="5" fill="#FFE082" filter="url(#intenseGlow)" />
  </g>

  <g class="rotate-orbit-3">
    <ellipse cx="250" cy="250" rx="160" ry="80" fill="none" stroke="url(#energyGrad)" stroke-width="2" transform="rotate(110, 250, 250)" filter="url(#glow)" />
    <circle cx="250" cy="90" r="3.5" fill="#FFFFFF" filter="url(#intenseGlow)" />
  </g>

  <!-- Central Floating Mind Stone -->
  <g class="float-gem">
    <!-- Back Gem Glow -->
    <polygon points="250,90 325,180 340,270 250,400 160,270 175,180" fill="url(#stoneGlow)" filter="url(#intenseGlow)" opacity="0.8" />

    <!-- Gem Facets -->
    <!-- Base Core -->
    <polygon points="250,90 325,180 340,270 250,400 160,270 175,180" fill="#FF8F00" />
    
    <!-- Top Main Facet -->
    <polygon points="250,90 290,165 250,230 210,165" fill="#FFE082" opacity="0.9" />
    
    <!-- Side Top Left -->
    <polygon points="250,90 210,165 175,180" fill="#FFCA28" opacity="0.8" />
    
    <!-- Side Top Right -->
    <polygon points="250,90 290,165 325,180" fill="#FFB300" opacity="0.85" />
    
    <!-- Center Mid Facet -->
    <polygon points="210,165 290,165 310,250 250,290 190,250" fill="#FFD54F" />
    
    <!-- Left Mid Facet -->
    <polygon points="175,180 210,165 190,250 160,270" fill="#FF8F00" opacity="0.9" />
    
    <!-- Right Mid Facet -->
    <polygon points="325,180 290,165 310,250 340,270" fill="#FF6F00" opacity="0.95" />
    
    <!-- Bottom Center Facet -->
    <polygon points="250,290 310,250 250,400" fill="#E65100" />
    
    <!-- Bottom Left Facet -->
    <polygon points="250,290 190,250 250,400" fill="#FF8F00" />
    
    <!-- Outer Edge Highlights -->
    <polygon points="190,250 160,270 250,400" fill="#BF360C" opacity="0.6" />
    <polygon points="310,250 340,270 250,400" fill="#DD2C00" opacity="0.6" />

    <!-- Highlight Inner Flare (Pulsing Core Center) -->
    <ellipse class="pulse-bg" cx="250" cy="210" rx="35" ry="45" fill="#FFFFFF" opacity="0.7" filter="url(#glow)" />
  </g>
</svg>
