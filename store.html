<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vision — Store Detail</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23FF6F61'/%3E%3Cstop offset='100%25' stop-color='%23486AAE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Cpath d='M10 34 L20 34 L24 24 L30 44 L36 20 L40 34 L54 34' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css?v=10" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>

<div class="topbar">
  <div>
    <a class="nav-btn" href="index.html">← Vision Home</a>
    <span id="backToCity"></span>
    <h1 id="storeTitle">Loading…</h1>
  </div>
  <div class="controls">
    <button id="refreshBtn" class="btn-icon-refresh" title="Fetch live data from sheet" onclick="doRefresh()">⟳</button>
    <div class="toggle-group" id="periodToggle">
      <button data-val="DoD" class="active">DoD</button>
      <button data-val="WoW">WoW</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="chartGrid" class="chart-grid"><div class="loading">Loading…</div></div>
</div>

<script src="config.js?v=2"></script>
<script src="citycharts.js?v=14"></script>
<script>
const params = new URLSearchParams(window.location.search);
const STORE_CODE = params.get('store');
let period = 'DoD';
let rawSeries = null;

document.getElementById('periodToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  [...e.currentTarget.children].forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  period = e.target.dataset.val;
  renderStoreCharts(rawSeries, period);
});

async function load(force) {
  document.getElementById('chartGrid').innerHTML = '<div class="loading">Loading…</div>';
  try {
    const data = await fetchStoreData(STORE_CODE, renderStoreData, force);
    renderStoreData(data);
  } catch (err) {
    document.getElementById('chartGrid').innerHTML = loadErrorHTML(err.message, 'load');
  }
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  try { await load(true); }
  finally { btn.classList.remove('spinning'); btn.disabled = false; }
}

function renderStoreData(data) {
  rawSeries = data.series;
  document.getElementById('storeTitle').textContent = `${data.storeCode} — ${data.city} (QC)`;
  document.getElementById('backToCity').innerHTML =
    `<a class="nav-btn" href="city.html?city=${encodeURIComponent(data.city)}&service=QC" style="margin-right:8px;">← Back to ${data.city}</a>`;
  document.getElementById('chartGrid').innerHTML = storeChartCardsHTML();
  renderStoreCharts(rawSeries, period);
}
load();
</script>
</body>
</html>
