<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vision — City Detail</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

<div class="topbar">
  <div>
    <a class="back-link" href="index.html">← Back to Vision home</a>
    <h1 id="cityTitle">Loading…</h1>
  </div>
  <div class="controls">
    <div class="toggle-group" id="periodToggle">
      <button data-val="DoD" class="active">DoD</button>
      <button data-val="WoW">WoW</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="chartGrid" class="chart-grid"><div class="loading">Loading…</div></div>
</div>

<script src="config.js"></script>
<script src="citycharts.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const CITY = params.get('city');
const SERVICE = params.get('service') || 'Non-QC Inhouse';
let period = 'DoD';
let cityMeta = {}, rawSeries = null;

document.getElementById('cityTitle').textContent = `${CITY} — ${SERVICE}`;

document.getElementById('periodToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  [...e.currentTarget.children].forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  period = e.target.dataset.val;
  renderCityCharts(cityMeta, rawSeries, period);
});

async function load() {
  try {
    const data = await fetchCityData(CITY, SERVICE);
    cityMeta = { overallBreachBaseline: data.overallBreachBaseline, ltBaseline: data.ltBaseline };
    rawSeries = data.series;
    document.getElementById('chartGrid').innerHTML = chartCardsHTML(cityMeta);
    renderCityCharts(cityMeta, rawSeries, period);
  } catch (err) {
    document.getElementById('chartGrid').innerHTML =
      `<div class="empty-state">Couldn't load data: ${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
