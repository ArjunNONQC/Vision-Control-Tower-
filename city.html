<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- The HTML files carry no ?v= cache-buster (they ARE the entry point), so
     without this a browser or CDN can serve a months-old page that loads the
     new JS but keeps old inline markup. Revalidate the shell every time; the
     versioned .js/.css it pulls in stay cacheable. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<title>Vision — City Detail</title>
<link rel="icon" type="image/svg+xml" href="vision-icon.svg" />
<link rel="stylesheet" href="style.css?v=23" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>

<div class="topbar">
  <div>
    <a class="nav-btn" id="homeLink" href="index.html">← Vision Home</a>
    <h1><img src="vision-icon.svg" alt="" class="vision-icon" /><span id="cityTitle">Loading…</span></h1>
  </div>
  <div class="controls">
    <button id="refreshBtn" class="btn-icon-refresh" title="Fetch live data from sheet" onclick="doRefresh()">⟳</button>
    <div class="toggle-group" id="serviceToggle">
      <button data-val="Non-QC Inhouse" class="active">Non-QC</button>
      <button data-val="QC">QC</button>
    </div>
    <div class="toggle-group" id="periodToggle">
      <button data-val="DoD" class="active">DoD</button>
      <button data-val="WoW">WoW</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="diagBanner"></div>
  <div id="scorecardHolder"></div>
  <div id="chartGrid" class="chart-grid"><div class="loading">Loading…</div></div>
  <div id="storeListHolder"></div>
</div>

<script src="config.js?v=2"></script>
<script src="citycharts.js?v=42"></script>
<script>
const params = new URLSearchParams(window.location.search);
const CITY = params.get('city');
let service = params.get('service') || 'Non-QC Inhouse';
let period = params.get('period') === 'WoW' ? 'WoW' : 'DoD';
let cityMeta = {}, rawSeries = null, cityData = null;

document.getElementById('cityTitle').textContent = CITY;
[...document.getElementById('serviceToggle').children].forEach(b => {
  b.classList.toggle('active', b.dataset.val === service);
});
[...document.getElementById('periodToggle').children].forEach(b => {
  b.classList.toggle('active', b.dataset.val === period);
});

// So "← Vision Home" from a QC city lands on the QC home view (and Non-QC on
// Non-QC), instead of always resetting to Non-QC.
function updateHomeLink_() {
  document.getElementById('homeLink').href = `index.html?service=${encodeURIComponent(service)}&period=${period}`;
  try { history.replaceState(null, '', `?city=${encodeURIComponent(CITY)}&service=${encodeURIComponent(service)}&period=${period}`); } catch (e) {}
}
updateHomeLink_();

document.getElementById('serviceToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  [...e.currentTarget.children].forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  service = e.target.dataset.val;
  updateHomeLink_();
  load();
});
document.getElementById('periodToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  [...e.currentTarget.children].forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  period = e.target.dataset.val;
  updateHomeLink_();
  renderScorecards(); // the cold chain card has a WoW version too
  renderForService();
});

// Cold chain: the WoW toggle shows the WoW sheet's tab, DoD the daily one.
// ('coldChainWeekly' missing = a payload cached before it existed -> daily.)
function renderScorecards() {
  if (!cityData) return;
  const cold = (period === 'WoW' && 'coldChainWeekly' in cityData) ? cityData.coldChainWeekly : cityData.coldChain;
  const ageingLabel = cityData.ageing ? 'D-1, latest' : null;
  document.getElementById('scorecardHolder').innerHTML =
    statPanelsHTML(cityData.orderSummary, cold, cityData.ageing, ageingLabel, service);
}

function renderForService() {
  if (service === 'QC') renderQcCharts(cityMeta, rawSeries, period);
  else renderNonQcCharts(cityMeta, rawSeries, period);
}

async function load(force) {
  document.getElementById('chartGrid').innerHTML = '<div class="loading">Loading…</div>';
  document.getElementById('storeListHolder').innerHTML = '';
  try {
    const data = await fetchCityData(CITY, service, renderCityData, force);
    renderCityData(data);
    if (service === 'QC') {
      fetchStoresData(CITY, force).then(sd => {
        document.getElementById('storeListHolder').innerHTML = storeListHTML(sd);
      }).catch(() => {});
    }
  } catch (err) {
    document.getElementById('chartGrid').innerHTML = loadErrorHTML(err.message, 'load');
  }
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  try { await load(true); }
  finally { btn.classList.remove('spinning'); btn.disabled = false; }
}

async function renderCityData(data) {
  cityData = data;
  // weeklySeries MUST be carried here: the chart renderers read the WoW sheet's
  // weekly rows from cityMeta, and fall back to re-bucketing daily numbers without it.
  cityMeta = { overallBreachBaseline: data.overallBreachBaseline, ltBaseline: data.ltBaseline, sddFasterBaseline: data.sddFasterBaseline, acceptancePartners: data.acceptancePartners || [], weeklySeries: data.weeklySeries };
  rawSeries = data.series;
  document.getElementById('cityTitle').textContent = `${CITY} — ${service}`;
  document.getElementById('diagBanner').innerHTML = schemaWarningHTML(data.schemaWarnings);

  renderScorecards();

  document.getElementById('chartGrid').innerHTML = service === 'QC' ? qcChartCardsHTML(cityMeta) : nonQcChartCardsHTML(cityMeta);
  renderForService();

  // Retry Rate / Fake Retry % / Cancellation % baselines = Pan India's own
  // current-day value for that metric. Fetched separately (usually served
  // instantly from the background prefetch cache) and only re-rendered once
  // it resolves, so the rest of the page never waits on it.
  const { retryBaseline, fakeRetryBaseline, cancellationBaseline } = await fetchPanIndiaRetryBaselines_(service);
  if (cityMeta.retryBaseline !== retryBaseline || cityMeta.fakeRetryBaseline !== fakeRetryBaseline || cityMeta.cancellationBaseline !== cancellationBaseline) {
    cityMeta.retryBaseline = retryBaseline;
    cityMeta.fakeRetryBaseline = fakeRetryBaseline;
    cityMeta.cancellationBaseline = cancellationBaseline;
    document.getElementById('chartGrid').innerHTML = service === 'QC' ? qcChartCardsHTML(cityMeta) : nonQcChartCardsHTML(cityMeta);
    renderForService();
  }
}
load();
</script>
</body>
</html>
