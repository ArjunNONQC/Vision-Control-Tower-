<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- The HTML files carry no ?v= cache-buster (they ARE the entry point), so
     without this a browser or CDN can serve a months-old page that loads the
     new JS but keeps old inline markup. Revalidate the shell every time; the
     versioned .js/.css it pulls in stay cacheable. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<title>Vision — City Tracker</title>
<link rel="icon" type="image/svg+xml" href="vision-icon.svg" />
<link rel="stylesheet" href="style.css?v=23" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <h2>Vision — City Tracker</h2>
    <p>Enter password to continue</p>
    <input type="password" id="lockInput" placeholder="Password" autocomplete="off" />
    <button id="lockSubmit" class="nav-btn" style="background:var(--header-blue);border:none;width:100%;padding:10px;">Unlock</button>
    <div id="lockError" class="lock-error"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">

<div class="topbar">
  <div>
    <h1><img src="vision-icon.svg" alt="" class="vision-icon" />Vision — City Tracker</h1>
  </div>
  <div class="controls">
    <button id="refreshBtn" class="btn-icon-refresh" title="Refresh this view only" onclick="doRefresh()">⟳</button>
    <button id="hardRefreshBtn" class="btn-hard-refresh" title="Clear cache everywhere and reload fresh data for every city and store" onclick="doHardRefresh()">🗑️ Hard Refresh</button>
    <span id="hardRefreshStatus" class="hard-refresh-status"></span>
    <a class="nav-btn" href="explore.html">All Cities →</a>
    <div class="toggle-group" id="serviceToggle">
      <button data-val="Non-QC Inhouse" class="active">Non-QC</button>
      <button data-val="QC">QC</button>
    </div>
    <div class="toggle-group" id="periodToggle">
      <button data-val="DoD" class="active">DoD</button>
      <button data-val="WoW">WoW</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="diagBanner"></div>
  <div id="panIndiaAgeing"></div>
  <div id="coldTripSummary"></div>
  <div id="panIndiaAcceptance"></div>
  <div class="section-label">Needs attention</div>
  <div id="breachGrid" class="card-grid"><div class="loading">Loading…</div></div>

  <div class="section-label">As per trend</div>
  <div id="trendStrip" class="card-grid"></div>
</div>

</div><!-- /appRoot -->

<script src="config.js?v=2"></script>
<script src="citycharts.js?v=37"></script>
<script>
const LOCK_KEY = 'vision_unlocked';

function initLock() {
  const lockScreen = document.getElementById('lockScreen');
  const appRoot = document.getElementById('appRoot');
  const input = document.getElementById('lockInput');
  const errorEl = document.getElementById('lockError');

  // localStorage (not sessionStorage) — sessionStorage is scoped per tab, so
  // navigating back from a city page in a way the browser treats as a "new"
  // browsing context (a new tab, or a mobile browser that discards session
  // storage when backgrounded) re-triggered the lock screen. localStorage is
  // shared across tabs/windows for this origin and survives that, so once
  // unlocked it stays unlocked until the browser's site data is cleared.
  if (localStorage.getItem(LOCK_KEY) === '1') {
    lockScreen.style.display = 'none';
    appRoot.style.display = 'block';
    load();
    return;
  }

  function tryUnlock() {
    if (input.value === DASHBOARD_PASSWORD) {
      localStorage.setItem(LOCK_KEY, '1');
      lockScreen.style.display = 'none';
      appRoot.style.display = 'block';
      load();
    } else {
      errorEl.textContent = 'Incorrect password';
      input.value = '';
      input.focus();
    }
  }

  document.getElementById('lockSubmit').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
  input.focus();
}

// Deep-linked from a city/store/explore page via ?service=... so coming back
// to "Vision Home" from a QC city lands on the QC home view (and Non-QC on
// Non-QC), instead of always resetting to Non-QC.
const requestedService = new URLSearchParams(window.location.search).get('service');
const state = { service: requestedService === 'QC' ? 'QC' : 'Non-QC Inhouse', period: 'DoD' };
[...document.getElementById('serviceToggle').children].forEach(b => {
  b.classList.toggle('active', b.dataset.val === state.service);
});

document.getElementById('serviceToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  setActive(e.currentTarget, e.target);
  state.service = e.target.dataset.val;
  load();
});
document.getElementById('periodToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  setActive(e.currentTarget, e.target);
  state.period = e.target.dataset.val;
  load();
});
function setActive(group, btn) {
  [...group.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }

// metricLabel() lives in citycharts.js — see the note there on why display
// labels must not be defined in this file.

function renderBreachCard(c) {
  const sevClass = c.breaches[0].severity; // dominant severity for the left border
  const rows = c.breaches.map(b => {
    const arrow = b.trend === 'worsening' ? '▲' : (b.trend === 'improving' ? '▼' : '—');
    return `
      <div class="metric-row">
        <span class="metric-name">${metricLabel(b.metric)}</span>
        <span class="metric-vals">
          <span>${fmtPct(b.actual)} <span style="color:var(--text-muted)">vs ${fmtPct(b.baseline)}</span></span>
          <span class="pill ${b.severity}">+${(b.deviationPct*100).toFixed(0)}%</span>
          <span class="trend-arrow ${b.trend}" title="${b.trend}, ${Math.abs(b.trendDeltaPts).toFixed(1)}pt vs prior period">${arrow}</span>
        </span>
      </div>`;
  }).join('');

  return `
    <div class="city-card ${sevClass}" onclick="goToCity('${c.city}','${c.service}')">
      <div class="city-name">${cityIconHTML_(c.city)}${c.city}</div>
      <div class="driven-by">Driven by: ${metricLabel(c.drivenBy)}${c.orders != null ? ` <span class="card-orders">· ${c.orders.toLocaleString()} orders</span>` : ''}</div>
      ${rows}
    </div>`;
}

function goToCity(city, service) {
  window.location.href = `city.html?city=${encodeURIComponent(city)}&service=${encodeURIComponent(service)}`;
}

// "As per trend" mini scorecard — green-themed (nothing here is breaching),
// showing each tracked metric's actual value against its baseline the same
// way a breach card does, just without the severity pill/trend arrow (there's
// no deviation to badge when a city is comfortably under baseline).
// c.metrics comes from the backend's computeNonQcCityFlags_/computeQcCityFlags_
// — every city gets it now, not just breaching ones.
function renderTrendCard(c) {
  const rows = (c.metrics || []).filter(m => m.actual != null && m.baseline != null).map(m => `
      <div class="metric-row">
        <span class="metric-name">${metricLabel(m.metric)}</span>
        <span class="metric-vals">
          <span>${fmtPct(m.actual)} <span style="color:var(--text-muted)">vs ${fmtPct(m.baseline)}</span></span>
        </span>
      </div>`).join('');
  return `
    <div class="city-card good" onclick="goToCity('${c.city}','${c.service}')">
      <div class="city-name">${cityIconHTML_(c.city)}${c.city}</div>
      <div class="driven-by">${c.orders != null ? `<span class="card-orders">${c.orders.toLocaleString()} orders</span>` : ''}</div>
      ${rows}
    </div>`;
}

async function load(force) {
  document.getElementById('breachGrid').innerHTML = '<div class="loading">Loading…</div>';
  document.getElementById('trendStrip').innerHTML = '';
  try {
    const url = `${WEBAPP_URL}?action=home&service=${encodeURIComponent(state.service)}&period=${state.period}`;
    const data = await cachedFetchJSON(url, { onRevalidate: renderHomeData, force });
    renderHomeData(data);
  } catch (err) {
    document.getElementById('breachGrid').innerHTML =
      loadErrorHTML(err.message + '. Check WEBAPP_URL in config.js and that the Apps Script is deployed.', 'load');
  }
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  try { await load(true); }
  finally { btn.classList.remove('spinning'); btn.disabled = false; }
}

// Hard Refresh: clears BOTH cache layers everywhere — not just the current
// view — then rebuilds. doRefresh()/load(true) only bypasses the server cache
// for the ONE payload currently on screen; every other city, store, and the
// opposite QC/Non-QC toggle keep serving whatever was cached before, which is
// exactly the "have to load each city individually" gap this button closes.
async function doHardRefresh() {
  const btn = document.getElementById('hardRefreshBtn');
  const status = document.getElementById('hardRefreshStatus');
  btn.classList.add('spinning');
  btn.disabled = true;
  try {
    status.title = '';
    status.textContent = 'Clearing cache…';
    const res = await fetch(`${WEBAPP_URL}?action=hardrefresh`);
    const result = await parseJsonResponse_(res);
    if (result.error) throw new Error(result.error);

    // Server cache is now empty; the client's own copy would otherwise keep
    // serving stale data straight out of localStorage without a network call.
    clearAllLocalCache_();

    status.textContent = 'Reloading…';
    // Resetting the flag BEFORE reload matters: load() -> renderHomeData()
    // calls startBackgroundPrefetch() at the end of every normal page render,
    // and that call is a no-op unless prefetchStarted is false. Clearing it
    // here means THIS reload is what re-arms the walk across every other
    // city, store, and the opposite QC/Non-QC toggle — no separate call
    // needed, and no risk of firing the prefetch twice.
    prefetchStarted = false;
    await load(true);

    status.textContent = 'Refreshing cities & stores in background…';
    setTimeout(() => { if (status.textContent.indexOf('background') !== -1) status.textContent = ''; }, 8000);
  } catch (err) {
    // The full message (esp. the HTML-instead-of-JSON explanation from
    // parseJsonResponse_) can run long — keep the header bar's height intact
    // by showing a short line, with the complete detail on hover and in the
    // console for whoever's actually debugging this.
    console.error('Hard refresh failed:', err);
    status.textContent = 'Hard refresh failed — hover for details';
    status.title = err.message;
  } finally {
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
}

function renderHomeData(data) {
  try {
    const diagBanner = document.getElementById('diagBanner');
    diagBanner.innerHTML = schemaWarningHTML(data.schemaWarnings);
    if (data.diagnostic) {
      // asOf came back null — no rows matched this service at all
      diagBanner.innerHTML += `<div class="empty-state" style="background:#FDECEA;border:1px solid #F5C6C0;border-radius:8px;padding:12px 16px;margin-bottom:16px;color:#8B2E22;">
        <strong>No rows matched.</strong> ${data.diagnostic.message}
      </div>`;
      document.getElementById('breachGrid').innerHTML = '';
      document.getElementById('trendStrip').innerHTML = '';
      return;
    }

    document.getElementById('panIndiaAgeing').innerHTML =
      panIndiaAgeingBarHTML(data.ageing, data.service, data.panIndia);

    document.getElementById('coldTripSummary').innerHTML = coldTripSummaryHomeHTML(data.coldChainGrandTotal, data);

    renderPanIndiaAcceptance(data);

    const grid = document.getElementById('breachGrid');
    // Pan India now lives in the top summary row next to Cold Chain, not in
    // this grid — it isn't really a "city" that can breach against its own
    // baseline, it's the national rollup, so it never belonged in a list
    // titled "Needs attention" in the first place.
    // ROI is filtered out of every list, QC and Non-QC alike. "Needs
    // attention" is then ordered by order volume (descending), not by
    // breach % — the busiest city surfaces first regardless of how far over
    // its baseline it is.
    const citiesForGrid = data.cities
      .filter(c => !isExcludedCity_(c.city))
      .sort((a, b) => (b.orders || 0) - (a.orders || 0));
    grid.innerHTML = citiesForGrid.length
      ? citiesForGrid.map(renderBreachCard).join('')
      : '<div class="empty-state">No breached cities in this view.</div>';

    const trendCities = data.asPerTrend.filter(c => !isExcludedCity_(c.city));
    const strip = document.getElementById('trendStrip');
    if (!trendCities.length) {
      strip.innerHTML = '<div class="empty-state">—</div>';
    } else {
      strip.innerHTML = trendCities.map(renderTrendCard).join('');
    }

    startBackgroundPrefetch();
  } catch (err) {
    document.getElementById('breachGrid').innerHTML =
      loadErrorHTML(err.message + '. Check WEBAPP_URL in config.js and that the Apps Script is deployed.', 'load');
  }
}

let prefetchStarted = false;
function startBackgroundPrefetch() {
  if (prefetchStarted) return; // only ever run once per session, not on every toggle click
  prefetchStarted = true;
  // Pass the current toggles so the combo already on screen isn't re-fetched.
  setTimeout(() => prefetchAllCitiesAndStores(state.service, state.period), 300);
}

// 3P Acceptance Rate is a QC-only concept (Non-QC has no delivery partner
// network) — hidden entirely for Non-QC. Always daily grain, independent of
// the DoD/WoW toggle, since acceptance rate has no order-count to weight a
// weekly bucket by (unlike every other WoW-aware chart in this app).
function renderPanIndiaAcceptance(data) {
  const holder = document.getElementById('panIndiaAcceptance');
  const ap = data.acceptancePanIndia;
  if (data.service !== 'QC' || !ap || !ap.partners.length) { holder.innerHTML = ''; return; }
  holder.innerHTML = `
    <div class="chart-card" style="margin: 6px 0 20px;">
      <h3><span class="card-dot dot-share"></span>3P Partner Acceptance Rate — Pan India</h3>
      <div class="chart-canvas-wrap"><canvas id="chartAcceptancePanIndia"></canvas></div>
    </div>`;
  const labels = ap.dates.map(d => fmtDayLabel(d));
  makeMultiLineChart('chartAcceptancePanIndia', labels,
    ap.partners.map(p => ({
      label: p,
      data: ap.series[p].map(v => v != null ? round1_(v * 100) : null),
    })), '%', true);
}

initLock();
</script>
</body>
</html>
