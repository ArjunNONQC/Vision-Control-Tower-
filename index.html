<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vision — City Tracker</title>
<link rel="icon" type="image/svg+xml" href="vision-icon.svg" />
<link rel="stylesheet" href="style.css?v=14" />
</head>
<body>

<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <h2>Vision — City Tracker</h2>
    <p>Enter password to continue</p>
    <input type="password" id="lockInput" placeholder="Password" autocomplete="off" />
    <button id="lockSubmit" class="nav-btn" style="background:var(--header-blue);border:none;width:100%;padding:10px;">Unlock</button>
    <div id="lockError" class="lock-error"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">

<div class="topbar">
  <div>
    <h1><img src="vision-icon.svg" alt="" class="vision-icon" />Vision — City Tracker</h1>
  </div>
  <div class="controls">
    <button id="refreshBtn" class="btn-icon-refresh" title="Fetch live data from sheet" onclick="doRefresh()">⟳</button>
    <button id="downloadReportBtn" class="nav-btn" onclick="downloadReport()">⬇ Download Report</button>
    <a class="nav-btn" href="explore.html">All Cities →</a>
    <div class="toggle-group" id="serviceToggle">
      <button data-val="Non-QC Inhouse" class="active">Non-QC</button>
      <button data-val="QC">QC</button>
    </div>
    <div class="toggle-group" id="periodToggle">
      <button data-val="DoD" class="active">DoD</button>
      <button data-val="WoW">WoW</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="diagBanner"></div>
  <div id="panIndiaAgeing"></div>
  <div class="section-label">Needs attention</div>
  <div id="breachGrid" class="card-grid"><div class="loading">Loading…</div></div>

  <div class="section-label">As per trend</div>
  <div id="trendStrip" class="trend-strip"></div>
</div>

</div><!-- /appRoot -->

<script src="config.js?v=2"></script>
<script src="citycharts.js?v=20"></script>
<script>
const LOCK_KEY = 'vision_unlocked';

function initLock() {
  const lockScreen = document.getElementById('lockScreen');
  const appRoot = document.getElementById('appRoot');
  const input = document.getElementById('lockInput');
  const errorEl = document.getElementById('lockError');

  if (sessionStorage.getItem(LOCK_KEY) === '1') {
    lockScreen.style.display = 'none';
    appRoot.style.display = 'block';
    load();
    return;
  }

  function tryUnlock() {
    if (input.value === DASHBOARD_PASSWORD) {
      sessionStorage.setItem(LOCK_KEY, '1');
      lockScreen.style.display = 'none';
      appRoot.style.display = 'block';
      load();
    } else {
      errorEl.textContent = 'Incorrect password';
      input.value = '';
      input.focus();
    }
  }

  document.getElementById('lockSubmit').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
  input.focus();
}

const state = { service: 'Non-QC Inhouse', period: 'DoD' };

document.getElementById('serviceToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  setActive(e.currentTarget, e.target);
  state.service = e.target.dataset.val;
  load();
});
document.getElementById('periodToggle').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  setActive(e.currentTarget, e.target);
  state.period = e.target.dataset.val;
  load();
});
function setActive(group, btn) {
  [...group.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }

function metricLabel(m) {
  return m === 'Overall Breach' ? 'Overall Breach' : 'Long Tail (LM Induced)';
}

function renderBreachCard(c) {
  const sevClass = c.breaches[0].severity; // dominant severity for the left border
  const rows = c.breaches.map(b => {
    const arrow = b.trend === 'worsening' ? '▲' : (b.trend === 'improving' ? '▼' : '—');
    return `
      <div class="metric-row">
        <span class="metric-name">${metricLabel(b.metric)}</span>
        <span class="metric-vals">
          <span>${fmtPct(b.actual)} <span style="color:var(--text-muted)">vs ${fmtPct(b.baseline)}</span></span>
          <span class="pill ${b.severity}">+${(b.deviationPct*100).toFixed(0)}%</span>
          <span class="trend-arrow ${b.trend}" title="${b.trend}, ${Math.abs(b.trendDeltaPts).toFixed(1)}pt vs prior period">${arrow}</span>
        </span>
      </div>`;
  }).join('');

  return `
    <div class="city-card ${sevClass}" onclick="goToCity('${c.city}','${c.service}')">
      <div class="city-name">${cityIconHTML_(c.city)}${c.city}</div>
      <div class="driven-by">Driven by: ${metricLabel(c.drivenBy)}</div>
      ${rows}
    </div>`;
}

function goToCity(city, service) {
  window.location.href = `city.html?city=${encodeURIComponent(city)}&service=${encodeURIComponent(service)}`;
}

async function load(force) {
  document.getElementById('breachGrid').innerHTML = '<div class="loading">Loading…</div>';
  document.getElementById('trendStrip').innerHTML = '';
  try {
    const url = `${WEBAPP_URL}?action=home&service=${encodeURIComponent(state.service)}&period=${state.period}`;
    const data = await cachedFetchJSON(url, { onRevalidate: renderHomeData, force });
    renderHomeData(data);
  } catch (err) {
    document.getElementById('breachGrid').innerHTML =
      loadErrorHTML(err.message + '. Check WEBAPP_URL in config.js and that the Apps Script is deployed.', 'load');
  }
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  try { await load(true); }
  finally { btn.classList.remove('spinning'); btn.disabled = false; }
}

async function downloadReport() {
  const btn = document.getElementById('downloadReportBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Generating…';
  btn.disabled = true;
  try {
    const url = `${WEBAPP_URL}?action=generateReport&service=${encodeURIComponent(state.service)}&period=${state.period}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const byteChars = atob(data.base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = data.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (err) {
    alert("Couldn't generate report: " + err.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

function renderHomeData(data) {
  try {
    const diagBanner = document.getElementById('diagBanner');
    diagBanner.innerHTML = schemaWarningHTML(data.schemaWarnings);
    if (data.diagnostic) {
      // asOf came back null — no rows matched this service at all
      diagBanner.innerHTML += `<div class="empty-state" style="background:#FDECEA;border:1px solid #F5C6C0;border-radius:8px;padding:12px 16px;margin-bottom:16px;color:#8B2E22;">
        <strong>No rows matched.</strong> ${data.diagnostic.message}
      </div>`;
      document.getElementById('breachGrid').innerHTML = '';
      document.getElementById('trendStrip').innerHTML = '';
      return;
    }

    document.getElementById('panIndiaAgeing').innerHTML =
      panIndiaAgeingBarHTML(data.ageing, data.service, data.panIndia);

    const grid = document.getElementById('breachGrid');
    if (!data.cities.length) {
      grid.innerHTML = '<div class="empty-state">No breached cities in this view.</div>';
    } else {
      grid.innerHTML = data.cities.map(renderBreachCard).join('');
    }

    const strip = document.getElementById('trendStrip');
    if (!data.asPerTrend.length) {
      strip.innerHTML = '<div class="empty-state">—</div>';
    } else {
      strip.innerHTML = data.asPerTrend.map(c =>
        `<div class="trend-chip" onclick="goToCity('${c.city}','${c.service}')">${cityIconHTML_(c.city)}${c.city}</div>`
      ).join('');
    }

    startBackgroundPrefetch();
  } catch (err) {
    document.getElementById('breachGrid').innerHTML =
      loadErrorHTML(err.message + '. Check WEBAPP_URL in config.js and that the Apps Script is deployed.', 'load');
  }
}

let prefetchStarted = false;
function startBackgroundPrefetch() {
  if (prefetchStarted) return; // only ever run once per session, not on every toggle click
  prefetchStarted = true;
  setTimeout(() => prefetchAllCitiesAndStores(), 300); // let the home page finish painting first
}

initLock();
</script>
</body>
</html>
